[package]
name = "slatedb-engine"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-2.0-only"

[lib]
crate-type = ["staticlib"]

[dependencies]
cxx = "1.0"
slatedb = { version = "=0.13.1", features = ["compaction_filters"] }
object_store = { version = "0.12", features = ["aws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
bytes = "1.7"
parking_lot = "0.12"
once_cell = "1"
tokio-util = "0.7"
tracing = "0.1"
async-trait = "0.1"
regex = "1"

[features]
default = []
# Enables MTR-style simulated-failure helpers in `utils::dbug`. Kept off by
# default so release builds don't ship the corruption simulators.
dbug = []
# Enables the cxx::bridge Field/TABLE callback surface
# (`src/bridge_field.rs`). When on, the Rust build expects the C++
# shim header `storage/slatedb/shim/slatedb_field_callbacks.h` to
# provide the inline callback implementations. Off by default so
# `cargo test --lib` works without the C++ build context — CMake's
# `corrosion_import_crate(... FEATURES field_callbacks)` turns it on
# for the real plugin build.
field_callbacks = []

[dev-dependencies]
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["minio"] }
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio", "rustls"] }
aws-config = { version = "1", default-features = false, features = ["rt-tokio", "rustls"] }
